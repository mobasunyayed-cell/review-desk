[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-desk"
version = "0.1.0"
description = "Web app for reviewing AI responses with rubric scoring and inter-reviewer agreement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Basuny Abdo" }]
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.110",
    "medeval @ git+https://github.com/mobasunyayed-cell/medeval@v0.2.0",
    "pyjwt>=2.8",
    "sqlalchemy>=2.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/review_desk"]

[[tool.mypy.overrides]]
module = "medeval.*"
ignore_missing_imports = true  # medeval does not ship a py.typed marker yet
