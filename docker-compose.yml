services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: review_desk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review_desk"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      REVIEW_DESK_DATABASE_URL: postgresql+psycopg://review:${POSTGRES_PASSWORD}@db:5432/review_desk
      REVIEW_DESK_SECRET_KEY: ${REVIEW_DESK_SECRET_KEY:?set REVIEW_DESK_SECRET_KEY in .env}
      REVIEW_DESK_AUTO_CREATE_TABLES: "false"
    ports:
      - "8000:8000"

volumes:
  pgdata:
